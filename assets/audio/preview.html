<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier Showdown · Audio Preview</title>
<style>
  :root {
    --bg: #0b0a0f; --panel: #15131c; --panel-2: #1d1a26; --line: #2c2838; --text: #ece6f5; --dim: #9a91ad;
    --gold: #f2b43c; --red: #e0443e; --teal: #3fd1c0; --violet: #9d7bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; color: var(--text);
    background: radial-gradient(1200px 600px at 20% -10%, #2a1420 0%, transparent 60%), radial-gradient(900px 500px at 100% 0%, #10213a 0%, transparent 55%), var(--bg);
    min-height: 100vh;
  }
  header { display: flex; align-items: center; gap: 18px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: #0d0c12cc; position: sticky; top: 0; z-index: 5; backdrop-filter: blur(6px); }
  h1 { margin: 0; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 span { color: var(--gold); }
  #scope { flex: 1; height: 54px; min-width: 200px; background: #07060a; border: 1px solid var(--line); border-radius: 8px; }
  .status { font-size: 12px; color: var(--dim); text-align: right; min-width: 170px; }
  .status b { color: var(--teal); font-weight: 600; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; transition: border-color .12s, background .12s, transform .05s; }
  button:hover { border-color: var(--gold); }
  button:active { transform: translateY(1px); }
  button.primary { background: linear-gradient(180deg, #f2b43c, #c98a1c); color: #1a1205; border-color: #f7c868; font-weight: 700; }
  button.on { border-color: var(--teal); background: #123a37; }
  main { display: grid; grid-template-columns: 330px 1fr; gap: 20px; padding: 20px 28px 40px; }
  aside { display: flex; flex-direction: column; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .bus { display: grid; grid-template-columns: 58px 1fr 40px 26px; align-items: center; gap: 8px; margin: 6px 0; }
  .bus label { color: var(--dim); text-transform: capitalize; }
  .bus output { font-variant-numeric: tabular-nums; color: var(--dim); text-align: right; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tracks button { flex: 1 1 45%; text-align: left; }
  .tracks button small { display: block; color: var(--dim); font-size: 11px; }
  .now { margin-top: 8px; font-size: 12px; color: var(--dim); }
  .now b { color: var(--teal); }
  select { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  #log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); max-height: 210px; overflow: hidden; margin: 0; padding: 0; list-style: none; }
  #log li b { color: var(--text); font-weight: 500; }
  .groups { display: flex; flex-direction: column; gap: 18px; }
  .group h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: flex; gap: 10px; align-items: baseline; }
  .group h3 em { font-style: normal; color: #5f5873; font-size: 11px; letter-spacing: .06em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 10px 8px; cursor: pointer; position: relative; overflow: hidden; }
  .card:hover { border-color: var(--gold); }
  .card.flash { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset, 0 0 22px #3fd1c033; }
  .card .name { font-weight: 600; padding-right: 48px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card code { font-size: 11px; color: var(--dim); }
  .card canvas { display: block; width: 100%; height: 38px; margin: 6px 0 4px; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--dim); }
  .chips { display: flex; gap: 4px; }
  .chips button { padding: 1px 7px; font-size: 11px; border-radius: 6px; }
  .bus-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); position: absolute; top: 9px; right: 9px; }
  .bus-tag.voice { color: var(--violet); border-color: #4a3c7a; }
  .bus-tag.sfx { color: var(--teal); border-color: #1f5a54; }
  .scenarios { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .scenarios button { font-size: 12px; padding: 6px 8px; }
  #feet { width: 100%; height: 120px; display: block; background: #07060a; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
  .hint { font-size: 12px; color: var(--dim); margin: 6px 0 0; }
  #unlock { position: fixed; inset: auto 24px 24px auto; z-index: 10; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Frontier <span>Showdown</span> · Audio</h1>
  <canvas id="scope" width="900" height="108"></canvas>
  <div class="status"><div>Context: <b id="ctx-state">…</b></div><div id="load-state">Loading…</div></div>
  <button id="play-all">Play all</button>
</header>
<main>
  <aside>
    <section class="panel">
      <h2>Mixer</h2>
      <div id="mixer"></div>
      <div class="row" style="margin-top:10px">
        <button id="variation" class="on">Pitch/volume variation</button>
        <button id="slowmo">Slow-mo</button>
      </div>
    </section>
    <section class="panel">
      <h2>Music</h2>
      <div class="row tracks" id="tracks"></div>
      <div class="bus" style="grid-template-columns: 80px 1fr 40px; margin-top:10px">
        <label for="fade">Crossfade</label><input id="fade" type="range" min="0" max="4" step="0.1" value="1.5"><output id="fade-out">1.5s</output>
      </div>
      <div class="now">Now playing: <b id="now">—</b></div>
    </section>
    <section class="panel">
      <h2>Game events</h2>
      <div class="scenarios" id="scenarios"></div>
      <div class="row" style="margin-top:8px"><label for="lab" class="hint" style="margin:0">Winner</label><select id="lab"></select></div>
      <p class="hint">Fires mock <code>game.events</code> through <code>audio.attach()</code>.</p>
    </section>
    <section class="panel">
      <h2>Footsteps from atlas events</h2>
      <div class="row"><button data-gait="walk_fwd">Walk</button><button data-gait="run">Run</button><button data-gait="">Stop</button></div>
      <canvas id="feet" width="600" height="240"></canvas>
      <p class="hint">Frames marked ▲ carry <code>{"type":"step"}</code> events; the tracker fires on those frames.</p>
    </section>
    <section class="panel">
      <h2>Log</h2>
      <ul id="log"></ul>
    </section>
  </aside>
  <div class="groups" id="groups"></div>
</main>
<button id="unlock" class="primary">Enable audio</button>
<script type="module" src="./preview.js"></script>
</body>
</html>
